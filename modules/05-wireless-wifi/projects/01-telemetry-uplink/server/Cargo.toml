[package]
name        = "m05-p01-telemetry-server"
version     = "0.1.0"
edition     = "2021"
description = "Axum server that ingests JSON telemetry from the ESP32 firmware."
publish     = false

[lints]
workspace = true

[dependencies]
axum               = "0.7"
tokio              = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http         = { version = "0.5", features = ["trace"] }
parking_lot        = "0.12"
time               = { version = "0.3", features = ["formatting", "macros"] }
