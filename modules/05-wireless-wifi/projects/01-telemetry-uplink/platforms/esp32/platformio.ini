; modules/05-wireless-wifi/projects/01-telemetry-uplink/platforms/esp32/platformio.ini

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32@^6.7.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
  -Wall -Wextra
  -DSERIAL_BAUD=115200
lib_deps      =
  bblanchon/ArduinoJson @ ^7.1.0
