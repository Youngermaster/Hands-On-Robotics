<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="monospace" font-size="13">
  <title>Module 01 wiring — single-board computer (Raspberry Pi / Jetson)</title>
  <rect x="0" y="0" width="520" height="340" fill="#fff"/>

  <!-- 40-pin header -->
  <rect x="20" y="40" width="200" height="260" rx="6" fill="#222" stroke="#000"/>
  <text x="120" y="62" text-anchor="middle" fill="#fff" font-weight="bold">40-PIN HEADER</text>
  <text x="120" y="82" text-anchor="middle" fill="#fff" font-size="11">(BCM numbering)</text>

  <!-- Pin labels -->
  <text x="220" y="140" fill="#fff" text-anchor="end">LED pin   ●</text>
  <text x="220" y="200" fill="#fff" text-anchor="end">BTN pin   ●</text>
  <text x="220" y="260" fill="#fff" text-anchor="end">GND       ●</text>

  <!-- Wires (orange for output, green for input, black for ground) -->
  <line x1="220" y1="138" x2="290" y2="138" stroke="#e80" stroke-width="3"/>
  <line x1="220" y1="198" x2="290" y2="198" stroke="#0a4" stroke-width="3"/>
  <line x1="220" y1="258" x2="480" y2="258" stroke="#333" stroke-width="3"/>

  <!-- 220 ohm -->
  <rect x="290" y="125" width="60" height="26" fill="#f0c060" stroke="#aa7700"/>
  <text x="320" y="143" text-anchor="middle">220Ω</text>

  <!-- LED -->
  <line x1="350" y1="138" x2="395" y2="138" stroke="#e80" stroke-width="3"/>
  <circle cx="405" cy="138" r="12" fill="#e64" stroke="#a40"/>
  <text x="405" y="142" text-anchor="middle" fill="#fff" font-size="11">LED</text>
  <line x1="417" y1="138" x2="480" y2="138" stroke="#333" stroke-width="3"/>
  <line x1="480" y1="138" x2="480" y2="258" stroke="#333" stroke-width="3"/>

  <!-- Button -->
  <line x1="290" y1="198" x2="340" y2="198" stroke="#0a4" stroke-width="3"/>
  <rect x="340" y="180" width="60" height="40" fill="#bbb" stroke="#666"/>
  <text x="370" y="205" text-anchor="middle">BTN</text>
  <line x1="400" y1="198" x2="480" y2="198" stroke="#333" stroke-width="3"/>

  <text x="20" y="318" font-size="11">Use internal pull-up (PUD_UP / SET_PULL_UP). 3.3 V logic — no level shifter needed.</text>
</svg>
