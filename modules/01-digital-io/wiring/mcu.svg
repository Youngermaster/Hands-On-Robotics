<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="monospace" font-size="13">
  <title>Module 01 wiring — generic MCU (Arduino / ESP32 / Pico)</title>
  <rect x="0" y="0" width="520" height="340" fill="#fff"/>

  <!-- Board -->
  <rect x="20" y="40" width="180" height="260" rx="8" fill="#1d6f42" stroke="#063"/>
  <text x="110" y="62" text-anchor="middle" fill="#fff" font-weight="bold">BOARD</text>
  <text x="110" y="82" text-anchor="middle" fill="#fff" font-size="11">(Arduino / ESP32 / Pico)</text>

  <!-- Pin labels on board -->
  <text x="200" y="140" fill="#fff" text-anchor="end">GPIO_OUT ●</text>
  <text x="200" y="200" fill="#fff" text-anchor="end">GPIO_IN  ●</text>
  <text x="200" y="260" fill="#fff" text-anchor="end">GND      ●</text>

  <!-- Wires -->
  <line x1="200" y1="138" x2="280" y2="138" stroke="#c33" stroke-width="3"/>
  <line x1="200" y1="198" x2="280" y2="198" stroke="#33c" stroke-width="3"/>
  <line x1="200" y1="258" x2="480" y2="258" stroke="#333" stroke-width="3"/>

  <!-- 220 ohm resistor -->
  <rect x="280" y="125" width="60" height="26" fill="#f0c060" stroke="#aa7700"/>
  <text x="310" y="143" text-anchor="middle">220Ω</text>

  <!-- LED -->
  <line x1="340" y1="138" x2="395" y2="138" stroke="#c33" stroke-width="3"/>
  <circle cx="405" cy="138" r="12" fill="#e64" stroke="#a40"/>
  <text x="405" y="142" text-anchor="middle" fill="#fff" font-size="11">LED</text>
  <line x1="417" y1="138" x2="480" y2="138" stroke="#333" stroke-width="3"/>
  <line x1="480" y1="138" x2="480" y2="258" stroke="#333" stroke-width="3"/>

  <!-- Button -->
  <line x1="280" y1="198" x2="340" y2="198" stroke="#33c" stroke-width="3"/>
  <rect x="340" y="180" width="60" height="40" fill="#bbb" stroke="#666"/>
  <text x="370" y="205" text-anchor="middle">BTN</text>
  <line x1="400" y1="198" x2="480" y2="198" stroke="#333" stroke-width="3"/>
  <line x1="480" y1="198" x2="480" y2="258" stroke="#333" stroke-width="3"/>

  <!-- Notes -->
  <text x="20" y="318" font-size="11">Internal pull-up on GPIO_IN; button shorts to GND when pressed.</text>
</svg>
