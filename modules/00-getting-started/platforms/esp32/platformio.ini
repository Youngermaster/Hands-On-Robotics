; modules/00-getting-started/platforms/esp32/platformio.ini
;
; ESP32 dev kit (DOIT ESP32-DevKit V1 or compatible). Uses the Arduino-ESP32
; framework — gentler than ESP-IDF for early modules.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32@^6.7.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
  -Wall -Wextra
  -DSERIAL_BAUD=115200
