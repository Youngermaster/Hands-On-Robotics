; modules/00-getting-started/platforms/pico/platformio.ini
;
; Raspberry Pi Pico (RP2040) via the arduino-pico core (Earle Philhower's port).
; This gives us Arduino-flavor APIs on top of pico-sdk while keeping UF2 flashing.

[platformio]
default_envs = pico

[env:pico]
platform        = https://github.com/maxgerhardt/platform-raspberrypi.git
board           = pico
framework       = arduino
board_build.core = earlephilhower
monitor_speed   = 115200
build_flags     =
  -Wall -Wextra
  -DSERIAL_BAUD=115200
