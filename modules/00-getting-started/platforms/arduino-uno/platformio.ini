; modules/00-getting-started/platforms/arduino-uno/platformio.ini
;
; What this file does:
;   - Targets a single board (the Arduino Uno).
;   - Pins the AVR platform to a specific version so the build is reproducible.
;   - Sets compile flags here (not in code) so every build is identical.

[platformio]
default_envs = uno   ; This file has just one env. Variants live in sibling folders.

[env:uno]
platform     = atmelavr@^4.2.0   ; ^ allows patch updates but not breaking changes.
board        = uno
framework    = arduino
upload_speed = 115200
monitor_speed = 9600
build_flags  =
  -Wall -Wextra -Wpedantic
  -DSERIAL_BAUD=9600
