; modules/07-robot-car/projects/02-wifi-websocket-control/platforms/esp32/platformio.ini
;
; ESP32 Wi-Fi car firmware. Hosts a WebSocket server on port 81.
; Uses Markus Sattler's WebSockets library — the de-facto choice for
; Arduino-ESP32 servers.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32@^6.7.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
  -Wall -Wextra
  -DSERIAL_BAUD=115200
lib_deps      =
  links2004/WebSockets @ ^2.4.1
