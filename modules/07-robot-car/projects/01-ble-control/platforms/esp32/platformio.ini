; modules/07-robot-car/projects/01-ble-control/platforms/esp32/platformio.ini
;
; ESP32 BLE car firmware. No external libraries — BLEDevice ships with
; Arduino-ESP32.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32@^6.7.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
  -Wall -Wextra
  -DSERIAL_BAUD=115200
  ; BLE pulls in a large stack. Bumping app partition gives us headroom
  ; (default huge_app.csv keeps OTA support; we don't need OTA here).
build_unflags =
  -fno-rtti
board_build.partitions = huge_app.csv
