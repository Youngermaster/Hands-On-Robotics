; modules/06-wireless-ble/platforms/esp32/platformio.ini
;
; ESP32 BLE LED firmware. No external libraries — BLEDevice ships with
; Arduino-ESP32.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32@^6.7.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags   =
  -Wall -Wextra
  -DSERIAL_BAUD=115200
; BLE stack pushes the app past the default partition size. huge_app gives
; us headroom (drops OTA slot — we don't use it here).
board_build.partitions = huge_app.csv
