# Workspace member: hor_common
# This package is installed editable by `uv sync` from the repo root.
[project]
name = "hor-common"
version = "0.1.0"
description = "Shared utilities for the Hands-On-Robotics modules."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hor_common"]
