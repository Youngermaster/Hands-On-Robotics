# Quality gates that run locally on commit and identically in CI.
# After cloning: `./scripts/host/bootstrap.sh && pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python: ruff (lint + import sort), black (format), mypy (types).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^common/python/
        additional_dependencies: [pydantic>=2, types-PyYAML]

  # Shell: shellcheck + shfmt.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: [-i, "2", -ci, -sr]

  # Markdown.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]
        exclude: ^(node_modules|apps/.*/node_modules)/

  # C/C++: clang-format. clang-tidy runs in CI (too slow for pre-commit).
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # Rust: rustfmt + clippy. Local-only hook so it uses the workspace toolchain.
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: bash -c 'command -v cargo >/dev/null && cargo fmt --all -- --check || true'
        language: system
        types: [rust]
        pass_filenames: false
      - id: clippy
        name: clippy
        entry: bash -c 'command -v cargo >/dev/null && cargo clippy --all-targets -- -D warnings || true'
        language: system
        types: [rust]
        pass_filenames: false
