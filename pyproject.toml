# Root pyproject for the Hands-On-Robotics monorepo.
# Managed with `uv` (https://docs.astral.sh/uv/).
#
# Layout:
#   - The umbrella project re-exports the shared library `hor_common`.
#   - Each module that needs extra deps declares an optional-dependency group
#     keyed by `mNN-<platform>` (e.g. `m01-rpi-zero-w`). Install with:
#         uv sync --extra m01-rpi-zero-w
#   - Per-board lockfiles are generated by CI for reproducibility.

[project]
name = "hands-on-robotics"
version = "0.1.0"
description = "Curriculum-led, hardware-modular robotics learning monorepo."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Juan Manuel Yepes Hoyos (Youngermaster)" }]

dependencies = [
  "hor-common",
]

[project.optional-dependencies]
# Module 01 — digital I/O.
m01-rpi-zero-w  = ["lgpio>=0.2.2.0"]
m01-rpi-4       = ["lgpio>=0.2.2.0"]
m01-jetson-nano = ["Jetson.GPIO>=2.1.4"]

# Dev tooling installed once at the workspace level.
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML",
]

[tool.uv.workspace]
members = ["common/python"]

[tool.uv.sources]
hor-common = { workspace = true }

# ---------------------------------------------------------------------------
# Linters & formatters
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["apps/**/node_modules", "**/.venv"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle + pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "SIM",           # simplify
  "RUF",           # ruff-specific
  "C4",            # comprehensions
  "TID",           # tidy imports
  "PL",            # pylint subset
]
ignore = [
  "PLR0913",  # too many arguments — common in hardware APIs
  "PLR2004",  # magic values — ok in pin numbers
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR2004", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["common/python/hor_common"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
# Hardware backends are optional imports — silence missing-import errors
# when running mypy on a dev machine without RPi libraries installed.
module = ["lgpio.*", "Jetson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["common/python/hor_common/tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = ["error"]
